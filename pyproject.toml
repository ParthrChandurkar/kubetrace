[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubetrace"
dynamic = ["version"]
description = "Evidence-based Kubernetes network diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kubernetes = [
    "kubernetes>=34.1,<35",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
kubetrace = "kubetrace.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kubetrace.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
